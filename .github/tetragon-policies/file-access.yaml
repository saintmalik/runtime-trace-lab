# Only paths that matter for the lab Trace (avoid flooding export with /home runner noise).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: file-access
spec:
  kprobes:
  - call: "security_file_permission"
    syscall: false
    return: true
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    returnArg:
      index: 0
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/curl-exfil"
        - "/root/.ssh"
  - call: "security_path_truncate"
    syscall: false
    return: true
    args:
    - index: 0
      type: "path"
    returnArg:
      index: 0
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/curl-exfil"
        - "/root/.ssh"
